<h1>TZ Media AI Video Generator</h1>

<p>
    Create realistic AI videos from text prompts using Wan2.1.

<label for="prompt">Video Prompt</label>

<textarea
    id="prompt"
    rows="8"
    placeholder="Describe the video you want to create..."
></textarea>

</div>

<script>

const button = document.getElementById("generateButton");
const status = document.getElementById("status");
const result = document.getElementById("result");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const videoContainer = document.getElementById("videoContainer");
const generatedVideo = document.getElementById("generatedVideo");
const downloadButton = document.getElementById("downloadButton");


function setProgress(value) {

    progressBar.style.width = value + "%";
    progressText.textContent = value + "%";

}


async function checkStatus(projectId) {

    try {

        const response = await fetch(
            "/api/projects/" +
            projectId +
            "/status"
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to check video status."
            );

        }

        const project = data.project;

        if (project.status === "generating") {

            setProgress(50);

            status.textContent =
                "Wan2.1 is generating your video...";

            setTimeout(function() {

                checkStatus(projectId);

            }, 3000);

            return;
        }


        if (project.status === "completed") {

            setProgress(100);

            status.textContent =
                "✅ Video generated successfully!";

            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            if (project.videoUrl) {

                generatedVideo.src =
                    project.videoUrl;

                generatedVideo.load();

                downloadButton.href =
                    project.videoUrl;

                videoContainer.style.display =
                    "block";
            }

            button.disabled = false;

            return;
        }


        if (project.status === "failed") {

            throw new Error(
                project.message ||
                "Video generation failed."
            );
        }


        setProgress(20);

        status.textContent =
            "Starting Wan2.1...";

        setTimeout(function() {

            checkStatus(projectId);

        }, 3000);


    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Error: " +
            error.message;

        result.textContent =
            "Error:\n" +
            error.message;

        setProgress(0);

        button.disabled = false;

    }
}


button.addEventListener(
    "click",
    async function() {

        const prompt =
            document
                .getElementById("prompt")
                .value
                .trim();

        const videoType =
            document
                .getElementById("videoType")
                .value;

        const duration =
            Number(
                document
                    .getElementById("duration")
                    .value
            );

        const voiceLanguage =
            document
                .getElementById("voiceLanguage")
                .value;

        const clipLength =
            Number(
                document
                    .getElementById("clipLength")
                    .value
            );


        if (!prompt) {

            status.textContent =
                "Please enter a video prompt.";

            return;
        }


        button.disabled = true;

        progressContainer.style.display =
            "block";

        videoContainer.style.display =
            "none";

        generatedVideo.removeAttribute("src");

        result.textContent = "";

        setProgress(10);

        status.textContent =
            "Connecting to Wan2.1...";


        try {

            const response =
                await fetch(
                    "/api/generate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            prompt: prompt,

                            videoType: videoType,

                            duration: duration,

                            voiceLanguage:
                                voiceLanguage,

                            clipLength:
                                clipLength

                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Video generation failed."
                );
            }


            if (
                !data.project ||
                !data.project.id
            ) {

                throw new Error(
                    "The server did not return a project ID."
                );
            }


            const projectId =
                data.project.id;


            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );


            setProgress(20);

            status.textContent =
                "Video request accepted. Wan2.1 is starting...";


            checkStatus(projectId);


        } catch (error) {

            console.error(
                "Generation error:",
                error
            );

            status.textContent =
                "❌ Error: " +
                error.message;

            result.textContent =
                "Error:\n" +
                error.message;

            setProgress(0);

            button.disabled = false;
        }

    }
);

</script>
